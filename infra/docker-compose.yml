version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    container_name: richys-eat-backend
    ports:
      - "4000:4000"
    env_file:
      - ../services/backend/.env
    restart: unless-stopped
    networks:
      - richys-eat-net

  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: Dockerfile
    container_name: richys-eat-ai-service
    ports:
      - "8000:8000"
    env_file:
      - ../services/ai-service/.env
    restart: unless-stopped
    networks:
      - richys-eat-net

networks:
  richys-eat-net:
    driver: bridge

# Note: Firebase (Auth/Firestore/Storage) and Firebase Hosting are managed
# cloud services and are not containerized here. Frontends (customer-web,
# admin-web, rider-web) build to static assets deployed to Firebase Hosting,
# not run in this compose file. A local Firebase emulator suite can be added
# in a later phase for offline dev if you want it.
