name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run build --workspace=packages/shared-types
      - run: npm run build --workspace=packages/design-tokens
      - run: npm run build --workspace=packages/firebase-client
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspace=services/backend --if-present
      - run: npm run build --workspace=apps/customer-web
      - run: npm run build --workspace=apps/admin-web
      - run: npm run build --workspace=apps/rider-web

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest tests/ -v
